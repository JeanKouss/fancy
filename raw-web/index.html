<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Sphère Interactive</title>
</head>
<body>
    <div class="info">
        Glissez pour faire tourner la sphère<br>
        Survolez les éléments pour les agrandir
    </div>

    <div class="sphere-container">
        <div class="sphere" id="sphere">
            <!-- Les éléments seront générés par JavaScript -->
        </div>
    </div>

    <div class="controls">
        <button class="control-btn" onclick="autoRotate()">Auto Rotation</button>
        <button class="control-btn" onclick="resetRotation()">Reset</button>
        <button class="control-btn" onclick="randomizeColors()">Couleurs</button>
    </div>
    <script src="./js/script.js"></script>
</body>
</html>
